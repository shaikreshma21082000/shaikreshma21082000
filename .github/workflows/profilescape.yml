name: Profilescape

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Shares a group with the Medium job so the two never edit README.md together.
concurrency:
  group: profile-readme
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chethandvg/profilescape@v1
        with:
          cards: hero,socials,stack,stats,languages
          theme: aurora
          readme: README.md
          config: .github/profilescape.json
